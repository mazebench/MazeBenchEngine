name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test native physics
        run: npm run test:physics
      - name: Verify the shipped WebAssembly and renderer
        run: npm run test:parity
      - name: Test benchmark checkpoints and version tracking
        run: node --test tests/benchmark-checkpoint-storage.test.mjs tests/benchmark-run-version.test.mjs tests/benchmark-version-catalogue.test.mjs
